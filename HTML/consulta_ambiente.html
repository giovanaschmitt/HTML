<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gerenciamento do Complexo Esportivo da UNIFEBE</title>

    <!--Chamada do código css-->
    <link rel="stylesheet" href="assets/css/style.css">

    <!--Fonte "Irian Sans" -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
        rel="stylesheet" rel="stylesheet">

    <!--Ícone do card do navegador-->
    <link rel="icon" type="image/png" href="assets/img/favicon_io/unifebe.png">
    <link rel="manifest" href="assets/img/favicon_io/site.webmanifest">
</head>

<body class="body-consulta_ambiente">
    <!--Menu-->
    <header>
        <!-- menu superior -->
        <div class="menu-icon" onclick="toggleMenu()">&#9776;</div>
        <div class="login-icon">
            <a href="login.html">
                <i class="fa fa-user"></i>
            </a>
        </div>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

        <!-- Menu lateral -->
        <nav id="side-menu" class="side-menu">
            <a href="#" class="close-btn" onclick="toggleMenu()">&times;</a>
            <a href="consulta_ambiente.html">Consulta do ambiente</a>
            <a href="consulta_data.html">Consulta de datas e horários disponíveis</a>
            <a href="agendar.html">Agendar espaço</a>
            <a href="cancelar.html">Cancelar espaço</a>
        </nav>

        <script src="assets/js/script.js"></script>

    </header>

    <main class="main">
        <section class="secao">
            <div class="imagem_index">
                <img src="assets/img/index/fundo.jpeg" alt="Imagem de fundo">
            </div>

            <div class="apresentacao">
                <h1>Agenda do espaço físico</h1>
            </div>
            <div class="bloco2">
                <!-- BOTÃO PARA ABRIR O MODAL -->
                <button id="abrirModalBtn" class="btn-agendar" type="button">Agendar</button>

                <!-- MODAL DE AGENDAMENTO -->
                <div id="modalAgendar" class="modal" aria-hidden="true">
                    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
                        <span class="close-btn" id="closeModal" title="Fechar">&times;</span>
                        <h3 id="modalTitulo">Agendar horário</h3>

                        <form id="formAgendar" novalidate>
                            <!-- Tipo de espaço -->
                            <label for="tipoEvento">Tipo de espaço</label>
                            <select id="tipoEvento" required>
                                <option value="" disabled selected>Selecione o espaço</option>
                                <option value="volei">Vôlei de Areia</option>
                                <option value="futebol">Futebol Society</option>
                                <option value="atletismo">Pista de Atletismo</option>
                            </select>

                            <!-- Data -->
                            <label for="dataEvento">Data</label>
                            <input type="date" id="dataEvento" required>

                            <!-- Horário inicial -->
                            <label for="horaInicio">Hora de início</label>
                            <input type="time" id="horaInicio" required>

                            <!-- Horário final -->
                            <label for="horaFim">Hora de término</label>
                            <input type="time" id="horaFim" required>

                            <button type="submit" class="btn-agendar">Confirmar Agendamento</button>
                        </form>
                    </div>
                </div>

                <script src="assets/js/script.js"></script>
            </div>

            <!-- LISTAGEM DE AGENDAMENTOS -->
            <section class="listagem-agendamentos">
                <h2>Agendamentos Registrados</h2>

                <!-- Filtro de data -->
                <div class="filtro-data">
                    <label for="filtroData">Filtrar por data:</label>
                    <input type="date" id="filtroData">
                </div>

                <!-- Tabela -->
                <table id="tabelaAgendamentos">
                    <thead>
                        <tr>
                            <th>Espaço</th>
                            <th>Data</th>
                            <th>Início</th>
                            <th>Término</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" style="text-align:center;">Nenhum agendamento encontrado.</td>
                        </tr>
                    </tbody>
                </table>
            </section>

        </section>
    </main>
</body>

</html>
