<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gerenciamento do Complexo Esportivo da UNIFEBE</title>

    <!--Chamada do código css-->
    <link rel="stylesheet" href="assets/css/style.css">

    <!--Fonte "Irian Sans" -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
        rel="stylesheet" rel="stylesheet">

    <!--Ícone do card do navegador-->
    <link rel="icon" type="image/png" href="assets/img/favicon_io/unifebe.png">
    <link rel="manifest" href="assets/img/favicon_io/site.webmanifest">
</head>

<body class="cancelar">
    <!--Menu-->
    <header>
        <!-- menu superior -->
        <div class="menu-icon" onclick="toggleMenu()">&#9776;</div>
        <div class="login-icon">
            <a href="login.html">
                <i class="fa fa-user"></i>
            </a>
        </div>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

        <!-- Menu lateral -->
        <nav id="side-menu" class="side-menu">
            <a href="#" class="close-btn" onclick="toggleMenu()">&times;</a>
            <a href="index.html">Início</a>
            <a href="agendar.html">Agendar espaço</a>
            <a href="meus_agendamentos.html">Meus agendamentos</a>
            <a href="cancelar.html">Cancelar espaço</a>

            <!-- Abas SOMENTE de admin -->
            <a id="abaAdmin1" href="todos_agendamentos.html">Todos os agendamentos</a>
            <a id="abaAdmin2" href="editar_ambiente.html">Editar os ambientes</a>
            <a id="abaAdmin3" href="bloquear_data.html">Bloquear data</a>
        </nav>



    </header>

    <main class="main">
        <section class="secao">
            <div class="imagem_index">
                <img src="assets/img/index/fundo.jpg" alt="Imagem de fundo">
            </div>

            <div class="apresentacao_consulta">
                <h1>Cancelar agendamento</h1>
            </div>
            <table id="tabelaCancelar">
                <thead>
                    <tr>
                        <th>Espaço</th>
                        <th>Data</th>
                        <th>Início</th>
                        <th>Término</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5" style="text-align:center;">Carregando...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <script src="assets/js/script.js"></script>

    <script>
        // === FUNÇÃO PARA PEGAR AGENDAMENTOS ===
        function getAgendamentos() {
            return JSON.parse(localStorage.getItem("agendamentos") || "[]");
        }

        // === FUNÇÃO PARA SALVAR ===
        function salvarAgendamentos(lista) {
            localStorage.setItem("agendamentos", JSON.stringify(lista));
        }

        // === CARREGAR TABELA ===
        document.addEventListener("DOMContentLoaded", () => {
            const tabela = document.querySelector("#tabelaCancelar tbody");
            const matricula = sessionStorage.getItem("matriculaUsuario");

            function carregarTabela() {
                const agendamentos = getAgendamentos().filter(a => a.matricula === matricula);

                tabela.innerHTML = "";

                if (agendamentos.length === 0) {
                    tabela.innerHTML = `<tr><td colspan="5" style="text-align:center;">Nenhum agendamento para cancelar.</td></tr>`;
                    return;
                }

                agendamentos.forEach((a, index) => {
                    const dataFormatada = new Date(a.data).toLocaleDateString('pt-BR');

                    const linha = document.createElement("tr");
                    linha.innerHTML = `
                <td>${a.tipo}</td>
                <td>${dataFormatada}</td>
                <td>${a.inicio}</td>
                <td>${a.fim}</td>
                <td><button class="btn-cancelar" data-index="${index}">Cancelar</button></td>
            `;
                    tabela.appendChild(linha);
                });
            }

            // === EVENTO DE CANCELAMENTO ===
            document.addEventListener("click", (e) => {
                if (e.target.classList.contains("btn-cancelar")) {
                    const index = e.target.getAttribute("data-index");

                    const todos = getAgendamentos();
                    const listaDoUsuario = todos.filter(a => a.matricula === matricula);

                    const agendamentoRemovido = listaDoUsuario[index];

                    if (!confirm(`Deseja cancelar o agendamento de ${agendamentoRemovido.tipo} às ${agendamentoRemovido.inicio}?`)) {
                        return;
                    }

                    // remove apenas do usuário
                    listaDoUsuario.splice(index, 1);

                    // recria lista completa
                    const novaLista = todos.filter(a => a.matricula !== matricula).concat(listaDoUsuario);

                    salvarAgendamentos(novaLista);

                    carregarTabela();
                }
            });

            carregarTabela();
        });

    </script>


</body>

</html>
